<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${nameOfApplication}">Matches</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script>
</head>

<body class="flex flex-col gap-4 bg-zinc-100">
<nav class="relative bg-white shadow-sm">
  <div class="mx-auto max-w-7xl px-2 sm:px-6 lg:px-8">
    <div class="relative flex h-16 justify-between">
      <div class="flex flex-1 items-center justify-center sm:items-stretch sm:justify-start">
        <div class="flex shrink-0 items-center">
          <img src="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color=indigo&shade=600" alt="Your Company" class="h-8 w-auto" />
        </div>
        <div class="sm:ml-6 sm:flex sm:space-x-8">
          <a href="/matches" class="inline-flex items-center px-1 pt-1 text-sm font-medium text-gray-900">Matches</a>
        </div>
        <div class="sm:ml-6 sm:flex sm:space-x-8">
          <a href="/results" class="inline-flex border-b-2 border-indigo-600 items-center px-1 pt-1 text-sm font-medium text-gray-900">Results</a>
        </div>
        <div class="sm:ml-6 sm:flex sm:space-x-8">
          <a href="/scoreboard" class="inline-flex items-center px-1 pt-1 text-sm font-medium text-gray-900">Scoreboard</a>
        </div>
      </div>
    </div>
  </div>
</nav>

<div class="p-4 flex flex-col gap-4 mx-auto">
  <th:block th:each="match : ${matches}">
  <th:block th:with="result=${results != null ? results.get(match) : null}">
    <div class="overflow-hidden rounded-lg bg-white shadow-sm sm:w-2xl">
      <div class="px-4 py-5 sm:p-6">
        <div role="list" class="divide-y divide-gray-200">
          <div class="py-4 grid grid-cols-6 sm:gap-4">
            <div class="sm:text-2xl col-span-2" th:text="${match.round()}"></div>
            <div class="m-auto text-sm" th:text="${match.date}"></div>
            <div class="m-auto text-sm" th:text="${match.time}"></div>
            <div class="m-auto text-sm" th:text="${match.group}"></div>
            <div class="m-auto text-sm" th:text="${match.ground}"></div>
          </div>

          <div class="py-4 grid grid-cols-3 text-xl">
            <div class="sm:text-3xl m-auto" th:text="${match.team1}"></div>
            <div class="m-auto">vs</div>
            <div class="sm:text-3xl m-auto" th:text="${match.team2}"></div>
            <form class="prediction-form col-span-3 py-4 flex flex-col text-xl gap-4" action="results" method="post">
              <input name="team1" th:value="${match.team1()}" class="hidden">
              <input name="team2" th:value="${match.team2()}" class="hidden">
              <input name="date" th:value="${match.date()}" class="hidden">
              <input name="time" th:value="${match.time()}" class="hidden">
              <div class="grid grid-cols-3">
                <input th:value="${result != null ? result.Score1() : ''}" th:disabled="${!isAdmin}" required name="score1" class="m-auto w-10 h-10 border-2 rounded text-center disabled:opacity-40 disabled:cursor-not-allowed" type="number" min="0">
                <div class="m-auto"></div>
                <input th:value="${result != null ? result.Score2() : ''}" th:disabled="${!isAdmin}" required name="score2" class="m-auto w-10 h-10 border-2 rounded text-center disabled:opacity-40 disabled:cursor-not-allowed" type="number" min="0">
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </th:block>
  </th:block>
</div>

</body>
</html>

<script>
    document.querySelectorAll('.prediction-form').forEach(form => {
        const inputs = form.querySelectorAll('input[type="number"]');

        inputs.forEach(input => {
            input.addEventListener('change', () => {
                if (form.checkValidity()) {
                    form.requestSubmit();
                }
            });
        });
    });
</script>

<style>
    /* Chrome, Edge, Safari */
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    /* Firefox */
    input[type="number"] {
        -moz-appearance: textfield;
        appearance: textfield;
    }
</style>
