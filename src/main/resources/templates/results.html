<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${nameOfApplication}">Matches</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="World Cup">
  <link rel="apple-touch-icon" href="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color=indigo&shade=600">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script>
</head>

<body class="flex flex-col gap-4 bg-zinc-100">
<nav class="relative bg-white shadow-sm px-4 py-2">
  <div class="flex gap-4 items-center justify-center sm:items-stretch sm:justify-start">
    <div class="flex shrink-0 items-center">
      <img src="logo.png" alt="Word Cup Prediction" class="h-12 w-auto" />
    </div>
    <div class="my-auto sm:ml-10">
      <a href="/matches" class="inline-flex items-center px-1 pt-1 text-sm font-medium text-gray-900">Matches</a>
    </div>
    <div class="my-auto">
      <a href="/results" class="inline-flex items-center border-b-2 border-indigo-600 px-1 pt-1 text-sm font-medium text-gray-900">Results</a>
    </div>
    <div class="my-auto">
      <a href="/scoreboard" class="inline-flex items-center px-1 pt-1 text-sm font-medium text-gray-900">Scoreboard</a>
    </div>
    <div class="my-auto mr-auto">
      <a href="/rules" class="inline-flex items-center px-1 pt-1 text-sm font-medium text-gray-900">Rules</a>
    </div>
  </div>
</nav>

<div class="p-4 flex flex-col gap-4 mx-auto">
  <th:block th:each="match, stat : ${matches}">
  <th:block th:with="result=${results != null ? results.get(match) : null}">
  <th:block th:with="prediction=${predictions != null ? predictions.get(match) : null}">
  <th:block th:with="isLive=${matchesWhoAreLive.contains(match)}">
    <div class="overflow-hidden rounded-lg bg-white shadow-sm sm:w-2xl">
      <div class="px-4 py-5 sm:p-6">
        <div th:if="${isLive}" class="relative col-span-12 bg-red-100 text-black text-center py-2 font-semibold rounded-md">
          <div>Live Updated</div>
          <span class="absolute top-2 right-2 flex h-3 w-3">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
            <span class="relative inline-flex h-3 w-3 rounded-full bg-red-500"></span>
          </span>
        </div>
        <div th:if="${match.hasStarted() and result != null and !isLive}"
             class="bg-green-500 text-white text-center py-2 font-semibold rounded-md">
          COMPLETED
        </div>
        <div role="list" class="divide-y divide-gray-200">

          <div class="flex flex-col gap-4 p-4">
            <div class="m-auto"
                 th:text="${match.ground()}">
            </div>
            <div class="text-2xl m-auto"
                 th:if="${match.group() != null}"
                 th:text="${match.group()} + ' - ' + ${match.round()}">
            </div>

            <div class="text-2xl m-auto"
                 th:if="${match.group() == null}"
                 th:text="'KO - ' + ${match.round()}">
            </div>
          </div>

          <div class="py-4 grid grid-cols-3 text-xl">
            <div class="sm:text-3xl m-auto" th:text="${match.team1}"></div>
            <div class="m-auto">vs</div>
            <div class="sm:text-3xl m-auto" th:text="${match.team2}"></div>
            <form class="prediction-form col-span-3 py-4 flex flex-col text-xl gap-4" action="results" method="post">
              <input name="team1" th:value="${match.team1()}" class="hidden">
              <input name="team2" th:value="${match.team2()}" class="hidden">
              <input name="date" th:value="${match.date()}" class="hidden">
              <input name="time" th:value="${match.time()}" class="hidden">
              <div class="grid grid-cols-3">
                <input
                  th:value="${result != null ? result.Score1() : ''}"
                  th:disabled="${!isAdmin}"
                  required
                  name="score1"
                  class="m-auto w-10 h-10 border-2 rounded text-center
                  disabled:opacity-40 disabled:cursor-not-allowed"
                  type="number"
                  min="0"
                >
                <div class="m-auto">Final Result</div>
                <input
                  th:value="${result != null ? result.Score2() : ''}"
                  th:disabled="${!isAdmin}"
                  required
                  name="score2"
                  class="m-auto w-10 h-10 border-2 rounded text-center
                  disabled:opacity-40 disabled:cursor-not-allowed"
                  type="number"
                  min="0"
                >
              </div>
            </form>
          </div>

          <div th:if="${prediction != null}" class="text-xl col-span-3 py-4 grid grid-cols-3 place-items-center">
            <p
              th:text="${prediction != null ? prediction.Score1() : ''}"
              class="m-auto w-10 h-10 border-2 rounded text-center
                  disabled:opacity-40 disabled:cursor-not-allowed"
            ></p>
            <p class="m-auto">Your Prediction</p>
            <p
              th:text="${prediction != null ? prediction.Score2() : ''}"
              class="m-auto w-10 h-10 border-2 rounded text-center
                  disabled:opacity-40 disabled:cursor-not-allowed"
            ></p>
          </div>
        </div>
      </div>
    </div>
  </th:block>
  </th:block>
  </th:block>
  </th:block>
</div>

<a href="/install"
   class="sticky bottom-0 right-0 text-center py-2 px-4 text-sm font-medium text-white bg-indigo-600"
   id="install-nav">
  Install as PWA
</a>

</body>
</html>

<script>
    document.querySelectorAll('.prediction-form').forEach(form => {
        const inputs = form.querySelectorAll('input[type="number"]');

        inputs.forEach(input => {
            input.addEventListener('change', () => {
                if (form.checkValidity()) {
                    form.requestSubmit();
                }
            });
        });
    });
</script>

<script>
    const installNav = document.querySelector("#install-nav");

    if (
        window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true
    ) {
        installNav.hidden = true;
    }
</script>

<style>
    /* Chrome, Edge, Safari */
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    /* Firefox */
    input[type="number"] {
        -moz-appearance: textfield;
        appearance: textfield;
    }
</style>
