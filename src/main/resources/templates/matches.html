<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${nameOfApplication}">Matches</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script>
</head>

<body class="flex flex-col gap-4 bg-zinc-100">
<nav class="relative bg-white shadow-sm">
  <div class="mx-auto max-w-7xl px-2 sm:px-6 lg:px-8">
    <div class="relative flex h-16 justify-between">
      <div class="flex flex-1 items-center justify-center sm:items-stretch sm:justify-start">
        <div class="flex shrink-0 items-center">
          <img src="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color=indigo&shade=600" alt="Your Company" class="h-8 w-auto" />
        </div>
        <div class="sm:ml-6 sm:flex sm:space-x-8">
          <a href="/matches" class="inline-flex items-center border-b-2 border-indigo-600 px-1 pt-1 text-sm font-medium text-gray-900">Matches</a>
        </div>
        <div class="sm:ml-6 sm:flex sm:space-x-8">
          <a href="/results" class="inline-flex items-center px-1 pt-1 text-sm font-medium text-gray-900">Results</a>
        </div>
        <div class="sm:ml-6 sm:flex sm:space-x-8">
          <a href="/scoreboard" class="inline-flex items-center px-1 pt-1 text-sm font-medium text-gray-900">Scoreboard</a>
        </div>
      </div>
    </div>
  </div>
</nav>

<div class="p-4 flex flex-col gap-4 mx-auto">
  <th:block th:each="match : ${matches}">
  <th:block th:with="prediction=${predictions != null ? predictions.get(match) : null}">
  <th:block th:with="result=${results != null ? results.get(match) : null}">
    <div class="overflow-hidden rounded-lg bg-white shadow-sm sm:w-2xl">
      <div class="px-4 py-5 sm:p-6">
        <div th:if="${match.hasStarted() and result == null}"
             class="bg-amber-500 text-white text-center py-2 font-semibold rounded-md">
          HAS STARTED
        </div>
        <div role="list" class="divide-y divide-gray-200">
          <div class="py-4 grid grid-cols-4 sm:grid-cols-6 sm:gap-4">
            <div class="sm:text-2xl col-span-4 sm:col-span-2" th:text="${match.round()}"></div>
            <div class="m-auto text-sm" th:text="${match.date}"></div>
            <div class="m-auto text-sm" th:text="${match.time}"></div>
            <div class="m-auto text-sm" th:text="${match.group}"></div>
            <div class="m-auto text-sm" th:text="${match.ground}"></div>
          </div>

          <div class="py-4 grid grid-cols-5 text-center text-xl">
            <div class="sm:text-3xl m-auto col-span-2" th:text="${match.team1}"></div>
            <div class="m-auto">vs</div>
            <div class="sm:text-3xl m-auto col-span-2" th:text="${match.team2}"></div>
            <form class="prediction-form col-span-5 py-4 flex flex-col text-xl gap-4" action="matches" method="post">
              <input name="team1" th:value="${match.team1()}" class="hidden">
              <input name="team2" th:value="${match.team2()}" class="hidden">
              <input name="date" th:value="${match.date()}" class="hidden">
              <input name="time" th:value="${match.time()}" class="hidden">
              <div class="grid grid-cols-5">
                <input th:value="${prediction != null ? prediction.Score1() : ''}"
                       th:disabled="${match.hasStarted()}"
                       required
                       name="score1"
                       class="col-span-2 m-auto w-10 h-10 border-2 rounded
                       text-center disabled:opacity-40 disabled:cursor-not-allowed"
                       type="number"
                       min="0">
                <div class="m-auto"></div>
                <input th:value="${prediction != null ? prediction.Score2() : ''}"
                       th:disabled="${match.hasStarted()}"
                       required
                       name="score2"
                       class="col-span-2 m-auto w-10 h-10 border-2 rounded
                       text-center disabled:opacity-40 disabled:cursor-not-allowed"
                       type="number"
                       min="0">
              </div>
              <th:block th:with="stats=${predictionStats != null ? predictionStats.get(match) : null}">
                <div th:if="${stats != null}" class="grid grid-cols-5 text-gray-600">
                  <div class="col-span-2 ">
                    <span th:text="${#numbers.formatDecimal(stats.team1WinPercentage(), 1, 1)} + '%'"></span>
                    <span>Win</span>
                  </div>

                  <div>
                    <span th:text="${#numbers.formatDecimal(stats.drawPercentage(), 1, 1)} + '%'"></span>
                    <span>Draw</span>
                  </div>

                  <div class="col-span-2 ">
                    <span th:text="${#numbers.formatDecimal(stats.team2WinPercentage(), 1, 1)} + '%'"></span>
                    <span>Win</span>
                  </div>
                </div>
              </th:block>
            </form>
          </div>
        </div>
      </div>
    </div>
  </th:block>
  </th:block>
  </th:block>
</div>

</body>
</html>

<script>
    document.querySelectorAll('.prediction-form').forEach(form => {
        const inputs = form.querySelectorAll('input[type="number"]');

        inputs.forEach(input => {
            input.addEventListener('change', async () => {
                if (!form.checkValidity()) return;

                const formData = new FormData(form);

                try {
                    const response = await fetch(form.action, {
                        method: form.method || 'POST',
                        body: formData
                    });

                    if (!response.ok) {
                        console.error("Submit failed");
                        return;
                    }

                    // optional: handle response
                    const html = await response.text();
                    console.log("Saved successfully");

                } catch (err) {
                    console.error("Network error:", err);
                }
            });
        });
    });
</script>

<style>
    /* Chrome, Edge, Safari */
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    /* Firefox */
    input[type="number"] {
        -moz-appearance: textfield;
        appearance: textfield;
    }
</style>
