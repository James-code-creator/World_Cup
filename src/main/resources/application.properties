# App
app.admin.username=${ADMIN_USERNAME:admin}
app.remember-me.key=${REMEMBER_ME_KEY:change-this-dev-secret}
app.remember-me.use-secure-cookie=${SECURE_COOKIE:false}

# DB
spring.datasource.url=jdbc:sqlite:${DB_PATH:./mydb.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
logging.level.org.hibernate.SQL=off

# Session
server.servlet.session.timeout=90d
server.servlet.session.cookie.max-age=90d

# Dev
spring.devtools.restart.enabled=false
